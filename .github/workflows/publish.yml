name: Publish site

on:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "images/**"
      - "index.html"
      - "favicon.svg"
      - "404.html"
      - ".nojekyll"

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit published site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Published files already match the build."
          else
            git commit -m "Publish site build"
            git push
          fi
